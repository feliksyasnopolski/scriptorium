name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  RAILS_ENV: test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/scriptorium_test

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: backend/.ruby-version
          bundler: 4.0.3
      - name: Install Ruby dependencies
        working-directory: backend
        run: bundle install
      - name: Prepare test database
        working-directory: backend
        run: bin/rails db:prepare
      - name: Run Rails tests
        working-directory: backend
        run: bin/rails test

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/scriptorium_development
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: backend/.ruby-version
          bundler: 4.0.3
      - name: Install Ruby dependencies
        working-directory: backend
        run: bundle install
      - name: Prepare development database
        working-directory: backend
        run: bin/rails db:prepare
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: frontend
        run: npm run test:e2e

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check whitespace errors
        run: git diff --check
