name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          
      - name: Install Playwright system dependencies
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Prepare test database
        working-directory: backend
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/scriptorium_test
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
        run: bin/rails db:prepare

      - name: Run Rails tests
        working-directory: backend
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/scriptorium_test
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
        run: bin/rails test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare development database
        working-directory: backend
        env:
          RAILS_ENV: development
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/scriptorium_development
        run: bin/rails db:prepare

      - name: Run Playwright suite
        working-directory: frontend
        env:
          CI: true
          RAILS_ENV: development
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/scriptorium_development
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          VITE_TURNSTILE_TEST_MODE: true
        run: npm run test:e2e

      - name: Check whitespace errors
        run: git diff --check

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
