service: scriptorium-backend

image: feliksyasnopolski/scriptorium-backend

servers:
  web:
    hosts:
      - 193.123.38.157

ssh:
  user: ubuntu

registry:
  server: ghcr.io
  username: feliksyasnopolski
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: arm64
  context: backend
  dockerfile: backend/Dockerfile

proxy:
  app_port: 3000
  hosts:
    - 193.123.38.157
  forward_headers: true
  healthcheck:
    path: /up
    interval: 5
    timeout: 5
  run:
    http_port: 8080
    https_port: 8443
    bind_ips:
      - 127.0.0.1

env:
  clear:
    RAILS_ENV: production
    FORCE_SSL: "false"
    SOLID_QUEUE_IN_PUMA: "true"
    RAILS_MAX_THREADS: "3"
    DATABASE_HOST: 172.18.0.1
  secret:
    - RAILS_MASTER_KEY
    - SCRIPTORIUM_DATABASE_PASSWORD
    - TURNSTILE_SECRET_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse bash
  migrate: app exec "bin/rails db:prepare"
